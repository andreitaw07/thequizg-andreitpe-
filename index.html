<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE QUIZ G</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 650px;
            background: #ffffff;
            color: #222;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 45px;
            color: #243b55;
        }

        .subtitle {
            font-size: 18px;
            color: #777;
            margin-bottom: 25px;
        }

        .difficulty-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 15px 25px;
            margin: 8px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .easy {
            background: #28a745;
            color: white;
        }

        .medium {
            background: #ffc107;
            color: black;
        }

        .hard {
            background: #dc3545;
            color: white;
        }

        .choice {
            display: block;
            width: 100%;
            margin: 12px 0;
            background: #e9ecef;
            color: #222;
            text-align: left;
        }

        .choice:hover {
            background: #d6d9dc;
        }

        .correct {
            background: #28a745 !important;
            color: white !important;
        }

        .wrong {
            background: #dc3545 !important;
            color: white !important;
        }

        #quizScreen,
        #resultScreen {
            display: none;
        }

        #question {
            font-size: 23px;
            margin: 25px 0;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #feedback {
            font-size: 18px;
            font-weight: bold;
            margin: 15px;
            min-height: 25px;
        }

        #nextButton {
            background: #243b55;
            color: white;
            display: none;
        }

        #restartButton {
            background: #243b55;
            color: white;
        }

        .score {
            font-size: 30px;
            font-weight: bold;
            color: #243b55;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- HOME SCREEN -->
    <div id="homeScreen">

        <h1>THE QUIZ G</h1>

        <div class="subtitle">
            THE QUIZ GENIUS
        </div>

        <p class="difficulty-title">
            COMPUTER PROGRAMMING
        </p>

        <p>
            Choose your difficulty:
        </p>

        <button class="easy" onclick="startQuiz('easy')">
            EASY
        </button>

        <button class="medium" onclick="startQuiz('medium')">
            MEDIUM
        </button>

        <button class="hard" onclick="startQuiz('hard')">
            HARD
        </button>

    </div>


    <!-- QUIZ SCREEN -->
    <div id="quizScreen">

        <div class="top-bar">
            <span id="difficultyText"></span>
            <span id="scoreText">Score: 0</span>
        </div>

        <p id="questionNumber"></p>

        <h2 id="question"></h2>

        <div id="choices"></div>

        <div id="feedback"></div>

        <button id="nextButton" onclick="nextQuestion()">
            NEXT QUESTION
        </button>

    </div>


    <!-- RESULT SCREEN -->
    <div id="resultScreen">

        <h1>GAME OVER!</h1>

        <p>Your final score is:</p>

        <div class="score" id="finalScore"></div>

        <p id="resultMessage"></p>

        <button id="restartButton" onclick="goHome()">
            PLAY AGAIN
        </button>

    </div>

</div>


<script>

const questions = {

    easy: [
        {
            question: "What does CPU stand for?",
            choices: [
                "Central Processing Unit",
                "Computer Personal Unit",
                "Central Program Utility",
                "Computer Processing User"
            ],
            answer: 0
        },

        {
            question: "Which device is used to type letters and numbers?",
            choices: [
                "Monitor",
                "Keyboard",
                "Speaker",
                "Printer"
            ],
            answer: 1
        },

        {
            question: "Which of these is a programming language?",
            choices: [
                "Python",
                "Google",
                "Windows",
                "YouTube"
            ],
            answer: 0
        },

        {
            question: "Which symbol is commonly used for comments in Python?",
            choices: [
                "//",
                "/*",
                "#",
                "@"
            ],
            answer: 2
        },

        {
            question: "Which one is an output device?",
            choices: [
                "Keyboard",
                "Mouse",
                "Microphone",
                "Monitor"
            ],
            answer: 3
        }
    ],


    medium: [
        {
            question: "Which Python function is used to display text?",
            choices: [
                "input()",
                "print()",
                "display()",
                "show()"
            ],
            answer: 1
        },

        {
            question: "Which data type is used for True or False?",
            choices: [
                "String",
                "Integer",
                "Boolean",
                "Float"
            ],
            answer: 2
        },

        {
            question: "Which symbol is used for equality comparison in Python?",
            choices: [
                "=",
                "==",
                "!=",
                "==="
            ],
            answer: 1
        },

        {
            question: "What does the len() function do?",
            choices: [
                "Deletes data",
                "Counts the length of an object",
                "Creates a variable",
                "Prints text"
            ],
            answer: 1
        },

        {
            question: "Which statement is used to make a decision in Python?",
            choices: [
                "if",
                "print",
                "import",
                "input"
            ],
            answer: 0
        }
    ],


    hard: [
        {
            question: "What is the output of 10 // 3?",
            choices: [
                "3",
                "3.33",
                "4",
                "1"
            ],
            answer: 0
        },

        {
            question: "Which Python data structure stores key-value pairs?",
            choices: [
                "List",
                "Tuple",
                "Dictionary",
                "Set"
            ],
            answer: 2
        },

        {
            question: "What does a for loop allow a programmer to do?",
            choices: [
                "Repeat a block of code",
                "Delete a program",
                "Create an operating system",
                "Turn off the computer"
            ],
            answer: 0
        },

        {
            question: "Which keyword is used to define a function in Python?",
            choices: [
                "function",
                "define",
                "def",
                "func"
            ],
            answer: 2
        },

        {
            question: "What is the output of 2 ** 3?",
            choices: [
                "5",
                "6",
                "8",
                "9"
            ],
            answer: 2
        }
    ]

};


let currentQuestions = [];
let currentQuestion = 0;
let score = 0;
let currentDifficulty = "";


function startQuiz(difficulty) {

    currentDifficulty = difficulty;

    currentQuestions = questions[difficulty];

    currentQuestion = 0;
    score = 0;

    document.getElementById("homeScreen").style.display = "none";
    document.getElementById("resultScreen").style.display = "none";
    document.getElementById("quizScreen").style.display = "block";

    document.getElementById("difficultyText").innerText =
        difficulty.toUpperCase();

    showQuestion();
}


function showQuestion() {

    const questionData = currentQuestions[currentQuestion];

    document.getElementById("questionNumber").innerText =
        "Question " + (currentQuestion + 1) +
        " of " + currentQuestions.length;

    document.getElementById("question").innerText =
        questionData.question;

    document.getElementById("scoreText").innerText =
        "Score: " + score;

    const choicesDiv = document.getElementById("choices");

    choicesDiv.innerHTML = "";

    document.getElementById("feedback").innerText = "";

    document.getElementById("nextButton").style.display = "none";


    questionData.choices.forEach(function(choice, index) {

        const button = document.createElement("button");

        button.innerText =
            String.fromCharCode(65 + index) + ". " + choice;

        button.className = "choice";

        button.onclick = function() {
            checkAnswer(index);
        };

        choicesDiv.appendChild(button);

    });
}


function checkAnswer(selectedAnswer) {

    const correctAnswer =
        currentQuestions[currentQuestion].answer;

    const buttons =
        document.querySelectorAll(".choice");

    buttons.forEach(function(button) {
        button.disabled = true;
    });


    if (selectedAnswer === correctAnswer) {

        score++;

        buttons[selectedAnswer].classList.add("correct");

        document.getElementById("feedback").innerText =
            "✓ Correct!";

    } else {

        buttons[selectedAnswer].classList.add("wrong");

        buttons[correctAnswer].classList.add("correct");

        document.getElementById("feedback").innerText =
            "✗ Wrong! The correct answer is " +
            currentQuestions[currentQuestion].choices[correctAnswer];
    }


    document.getElementById("scoreText").innerText =
        "Score: " + score;

    document.getElementById("nextButton").style.display =
        "inline-block";
}


function nextQuestion() {

    currentQuestion++;

    if (currentQuestion < currentQuestions.length) {

        showQuestion();

    } else {

        showResult();

    }
}


function showResult() {

    document.getElementById("quizScreen").style.display = "none";

    document.getElementById("resultScreen").style.display = "block";

    document.getElementById("finalScore").innerText =
        score + " / " + currentQuestions.length;


    if (score === currentQuestions.length) {

        document.getElementById("resultMessage").innerText =
            "Perfect score! Excellent job!";

    } else if (score >= 3) {

        document.getElementById("resultMessage").innerText =
            "Great job! Keep learning!";

    } else {

        document.getElementById("resultMessage").innerText =
            "Good try! Practice and try again!";

    }
}


function goHome() {

    document.getElementById("resultScreen").style.display = "none";

    document.getElementById("homeScreen").style.display = "block";
}

</script>

</body>
</html>
